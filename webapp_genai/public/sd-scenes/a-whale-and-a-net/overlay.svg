<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 520" width="100%" height="100%">
  <!-- Whale emerging from the water in foreground / midground -->
  <g id="obj-whale" data-name="whale" stroke="#1a2610" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Whale head and body surfacing -->
    <path d="M 65 410 C 80 340, 150 320, 220 350 C 260 368, 290 405, 305 435" />
    <!-- Whale mouth line -->
    <path d="M 75 395 C 105 385, 145 380, 180 390" />
    <!-- Whale eye -->
    <circle cx="165" cy="368" r="2.5" />
    <path d="M 160 364 C 165 362, 172 363, 175 366" />
    <!-- Blowhole and water spout -->
    <ellipse cx="195" cy="348" rx="5" ry="2" />
    <path d="M 195 346 C 193 320, 185 295, 175 280 C 172 275, 168 285, 170 295" />
    <path d="M 196 346 C 200 315, 208 288, 222 275 C 226 270, 221 282, 215 298" />
    <path d="M 194 330 C 180 315, 165 310, 155 312" />
    <path d="M 197 328 C 212 312, 228 308, 240 310" />
    <!-- Pectoral flipper -->
    <path d="M 215 390 C 240 405, 265 430, 275 460 C 265 455, 240 435, 220 415" />
    <!-- Grooves / pleats on throat/underbelly -->
    <path d="M 90 408 C 115 400, 140 398, 165 405" />
    <path d="M 105 418 C 128 410, 150 408, 175 415" />
    <path d="M 125 428 C 145 422, 165 420, 185 426" />
    <!-- Water splash / disturbance around surfacing body -->
    <path d="M 50 418 C 65 412, 75 415, 85 412 C 95 410, 105 416, 120 412" />
    <path d="M 285 438 C 300 432, 315 436, 330 430 C 340 435, 350 432, 360 436" />
    <path d="M 60 426 C 75 423, 90 425, 105 422" />
    <path d="M 270 445 C 290 442, 310 446, 335 440" />
  </g>

  <!-- Fishing net cast/trailing from ship over the water/whale -->
  <g id="obj-net" data-name="net" stroke="#1a2610" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main net ropes / hauling lines connecting to ship -->
    <path d="M 255 295 C 250 315, 235 340, 210 365" />
    <path d="M 275 288 C 280 315, 270 345, 245 375" />
    
    <!-- Outer boundary curve of the net -->
    <path d="M 155 370 C 190 355, 255 365, 280 395 C 295 420, 275 455, 225 470 C 175 480, 140 450, 130 420 C 125 395, 140 378, 155 370 Z" />

    <!-- Longitudinal grid lines of the mesh -->
    <path d="M 145 385 C 175 380, 230 385, 268 405" />
    <path d="M 135 405 C 170 400, 240 405, 275 425" />
    <path d="M 132 422 C 165 418, 235 422, 265 442" />
    <path d="M 140 440 C 170 438, 225 440, 250 455" />
    <path d="M 160 458 C 185 455, 215 458, 235 465" />

    <!-- Latitudinal / cross grid lines of the mesh -->
    <path d="M 160 372 C 150 400, 145 425, 155 450" />
    <path d="M 185 365 C 175 395, 170 430, 178 462" />
    <path d="M 210 362 C 202 395, 198 435, 205 468" />
    <path d="M 235 365 C 230 400, 225 435, 230 467" />
    <path d="M 260 378 C 255 405, 250 430, 250 455" />
    
    <!-- Floats / sinkers along net edge -->
    <circle cx="155" cy="370" r="3" />
    <circle cx="185" cy="363" r="3" />
    <circle cx="220" cy="362" r="3" />
    <circle cx="255" cy="372" r="3" />
    <circle cx="280" cy="395" r="3" />
    <circle cx="272" cy="432" r="3" />
    <circle cx="240" cy="462" r="3" />
    <circle cx="195" cy="472" r="3" />
    <circle cx="150" cy="450" r="3" />
    <circle cx="130" cy="415" r="3" />
  </g>
</svg>