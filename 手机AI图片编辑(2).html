function commitObjectVariant(v){let l=photos[index].layers.find(l=>l.id===selectedLayer);if(!l)return;layerSnapshot();l.variant=v;if(l.id==='birds')l.name=({goose:'大雁',pigeon:'鸽子',gull:'海鸥',swallow:'燕子',crow:'乌鸦'})[v]||'飞鸟';let c=l.color||'#69815a';if(l.id.startsWith('tree-'))l.svg=treeAppearance(v,c);else if(l.id==='boat')l.svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80"><path d="M5 55h90L77 74H23z" fill="${l.color||'#597b72'}"/>${v==='sail'?'<path d="M48 55V4l40 44H48" fill="#eadfc2" stroke="#52695c" stroke-width="2"/>':v==='yacht'?'<path d="M27 53V34h42l14 19z" fill="#e4e2d3"/><path d="M35 38h25v10H35" fill="#819eaa"/>':'<path d="M20 40l60 28" stroke="#a88966" stroke-width="5"/>'}</svg>`;else if(l.id==='birds'){let shapes={goose:'<path d="M10 32Q28 1 49 24L69 14Q80 8 88 16L95 18 86 22 75 22 56 36Q38 42 29 34L10 42 19 32"/>',pigeon:'<path d="M12 34Q24 4 49 22Q61 6 74 18L78 23 89 26 78 30Q74 43 53 41L28 38 11 43 18 34"/>',gull:'<path d="M3 18Q31 11 49 29Q69 9 97 17L66 35 52 39 34 33z"/>',swallow:'<path d="M4 5L48 26 95 5 71 35 54 39 32 47 39 35 17 28z"/>',crow:'<path d="M5 30L20 5 47 22 67 9 81 20 95 24 82 28 71 39 47 42 19 47 25 35z"/>'};let defaults={goose:'#756d5c',pigeon:'#8c9aa6',gull:'#e3e8e3',swallow:'#46536c',crow:'#34383e'};l.svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50"><g fill="${l.color||defaults[v]||'#566c69'}" stroke="#394c48" stroke-width="1">${shapes[v]||shapes.goose}</g></svg>`}else l.svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120"><path fill="#705940" d="M0 0h100v120H0z"/><path fill="#e4ddca" d="M7 7h86v106H7z"/>${v==='abstract'?`<circle cx="40" cy="45" r="23" fill="${c}"/><path d="M40 55h43v43H40" fill="#caa17d"/>`:v==='flower'?`<path d="M50 95V49" stroke="#6c845f" stroke-width="5"/><g fill="${c}"><circle cx="40" cy="40" r="17"/><circle cx="61" cy="40" r="17"/><circle cx="50" cy="58" r="17"/></g>`:`<path d="M15 95l30-55 40 55" fill="${c}"/>`}</svg>`;render()}
$('#chips').addEventListener('click',e=>{let color=e.target.closest('[data-object-color]'),variant=e.target.closest('[data-object-variant]');if(color)changeObjectColor(color.dataset.objectColor);if(variant)changeObjectVariant(variant.dataset.objectVariant);if(e.target.closest('#speciesToggle')){let l=photos[index].layers.find(l=>l.id===selectedLayer);if(l?.id==='birds')openBirdPanel();else $('#speciesMenu').hidden=!$('#speciesMenu').hidden}});

function closeChoice(){$('#choiceBackdrop').hidden=true}
$('#choiceBackdrop').onclick=e=>{if(e.target===$('#choiceBackdrop'))closeChoice()};
function openColorPanel(initial){let hue=210,sat=.65,val=.8,draft=initial;$('#choicePanel').innerHTML=`<div class="choice-header"><button id="cancelColor">取消</button><strong>选择颜色</strong><button class="color-confirm" id="confirmColor">确认</button></div><div class="color-gradient" id="colorGradient"><span class="color-cursor" id="colorCursor" style="left:65%;top:20%"></span></div><input class="hue-slider" id="hueSlider" type="range" min="0" max="360" value="210" aria-label="色相"><div class="color-value"><span class="color-sample" id="colorSample" style="background:${initial}"></span><span id="colorHex">${initial.toUpperCase()}</span></div>`;$('#choiceBackdrop').hidden=false;$('#cancelColor').onclick=closeChoice;$('#confirmColor').onclick=()=>{changeObjectColor(draft);closeChoice()};function update(){let h=hue/60,c=val*sat,x=c*(1-Math.abs(h%2-1)),m=val-c,a=h<1?[c,x,0]:h<2?[x,c,0]:h<3?[0,c,x]:h<4?[0,x,c]:h<5?[x,0,c]:[c,0,x];draft='#'+a.map(n=>Math.round((n+m)*255).toString(16).padStart(2,'0')).join('');$('#colorSample').style.background=draft;$('#colorHex').textContent=draft.toUpperCase();$('#colorGradient').style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,transparent),hsl(${hue} 100% 50%)`;$('#colorCursor').style.left=sat*100+'%';$('#colorCursor').style.top=(1-val)*100+'%'}let dragging=false;function choose(e){let r=$('#colorGradient').getBoundingClientRect();sat=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));val=1-Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));update()}$('#colorGradient').onpointerdown=e=>{dragging=true;e.currentTarget.setPointerCapture(e.pointerId);choose(e)};$('#colorGradient').onpointermove=e=>{if(dragging)choose(e)};$('#colorGradient').onpointerup=()=>dragging=false;$('#colorGradient').onpointercancel=()=>dragging=false;$('#hueSlider').oninput=e=>{hue=+e.target.value;update()}}
function openBirdPanel(){let birds=[['大雁','goose'],['鸽子','pigeon'],['海鸥','gull'],['燕子','swallow'],['乌鸦','crow']];$('#choicePanel').innerHTML='<div class="choice-header"><strong>选择鸟种</strong><button id="closeBirdPanel">关闭</button></div><div class="bird-grid">'+birds.map(([n,v],i)=>`<button class="bird-card" data-bird="${v}"><svg viewBox="0 0 100 60"><path d="${['M6 37Q28 5 48 28L73 17 91 24 77 29 58 43 25 43 8 51 19 37Z','M9 38Q25 5 48 27Q66 7 78 26L93 31 78 35Q67 52 40 44L13 50 21 39Z','M4 16Q28 9 49 31Q73 8 97 16L65 41 48 46 30 37Z','M4 5L48 27 96 5 71 40 53 43 30 55 38 39 14 29Z','M7 36L19 6 47 26 69 12 82 24 96 28 79 33 65 47 22 53 27 40Z'][i]}" fill="${['#a39579','#a7b8c7','#e5e9e1','#70829c','#555b62'][i]}"/></svg><span>${n}</span></button>`).join('')+'</div>';$('#choiceBackdrop').hidden=false;$('#closeBirdPanel').onclick=closeChoice;$('#choicePanel').onclick=e=>{let b=e.target.closest('[data-bird]');if(b){changeObjectVariant(b.dataset.bird);closeChoice()}}}

let pendingObject=null;
function colorFamily(hex){let rgb=hex.replace('#','').match(/../g).map(n=>parseInt(n,16)),[r,g,b]=rgb,max=Math.max(...rgb),min=Math.min(...rgb);if(max-min<25)return max<65?'黑色系':min>210?'白色系':'灰色系';if(r>g*1.25&&r>b*1.2)return '红色系';if(b>r*1.12&&b>g*1.05)return '蓝色系';if(g>r*1.08&&g>b*1.05)return '绿色系';if(r>150&&g>120&&b<120)return '黄色系';if(r>b*.9&&b>g*1.12)return '紫色系';return g>b?'绿色系':'蓝色系'}
function queueObjectChange(key,value){if(!selectedLayer||busy)return;if(!pendingObject||pendingObject.id!==selectedLayer)pendingObject={id:selectedLayer};pendingObject[key]=value;let parts=[];if(pendingObject.color)parts.push('颜色改成'+colorFamily(pendingObject.color)+'（'+pendingObject.color.toUpperCase()+'）');if(pendingObject.variant){let l=photos[index].layers.find(l=>l.id===selectedLayer),names={goose:'大雁',pigeon:'鸽子',gull:'海鸥',swallow:'燕子',crow:'乌鸦',pine:'松树',round:'圆冠树',birch:'白桦树',cypress:'柏树',palm:'棕榈树',sail:'帆船',canoe:'小舟',yacht:'游艇',mountain:'山景画',abstract:'几何画',flower:'花卉画'};parts.push('把'+(l.id==='birds'?'鸟种类':l.id.startsWith('tree-')?'树种':'外观')+'改成'+names[pendingObject.variant])}voiceDraft=parts.join('，并');voiceState='draft';$('#request').textContent=voiceDraft;$('#request').hidden=false;/* Keep choices visible so a second change can be combined. */}
function changeObjectColor(c){queueObjectChange('color',c)}
function changeObjectVariant(v){queueObjectChange('variant',v)}
const originalVoiceSend=$('#voiceSend').onclick;
$('#voiceSend').onclick=()=>{if(!pendingObject)return originalVoiceSend();if(busy)return;let job={...pendingObject},requestText=voiceDraft,jobToken=++token;busy=true;voiceState='rendering';$('#phone').classList.add('busy');$('#chips').style.display='none';$('#request').innerHTML='<span>'+requestText+'</span><span class="spinner" aria-label="正在生成" style="margin-left:auto"></span>';$('#request').hidden=false;setTimeout(()=>{if(jobToken!==token)return;selectedLayer=job.id;if(photos[index].layers.some(l=>l.id===job.id)){if(job.variant)commitObjectVariant(job.variant);if(job.color)commitObjectColor(job.color)}busy=false;voiceState='done';pendingObject=null;voiceDraft='';$('#phone').classList.remove('busy');$('#request').hidden=true;render()},2200)};
const originalResetVoice=resetVoice;resetVoice=function(){pendingObject=null;voiceDraft='';originalResetVoice()};
render();
</script></html>
